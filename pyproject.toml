[project]
name = "docqwise"
version = "0.1.1"
description = "Read, Extract, Retrieve:  Document intelligence that adapts, accelerates, and scales."
readme = "README.md"
license = {text = "Apache-2.0"}
requires-python = ">=3.9"
authors = [{name = "Venkatkumar Rajan"}]
keywords = [
    "document-intelligence", "ocr", "extraction", "rag", "nlp",
    "pdf", "table-extraction", "field-extraction", "document-ai",
    "structured-data", "unstructured-data", "graphrag", "mcp",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Text Processing :: General",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

dependencies = [
    "pymupdf>=1.23.0",
    "python-docx>=1.0.0",
    "numpy>=1.24.0",
    "pillow>=10.0.0",
    "tqdm>=4.65.0",
    "pyyaml>=6.0",
    "click>=8.0.0",
]

[project.optional-dependencies]
ml = [
    "easyocr>=1.7.0",
    "sentence-transformers>=2.2.0",
    "transformers>=4.35.0",
    "torch>=2.0.0",
    "spacy>=3.7.0",
]
full = [
    "docqwise[ml]",
    "pandas>=2.0.0",
    "openpyxl>=3.1.0",
    "camelot-py>=0.11.0",
    "pyarrow>=14.0.0",
    "rank-bm25>=0.2.2",
    "pydantic>=2.0.0",
    "beautifulsoup4>=4.12.0",
    "python-pptx>=0.6.21",
]
api = [
    "openai>=1.0.0",
    "anthropic>=0.20.0",
    "google-cloud-vision>=3.5.0",
    "boto3>=1.28.0",
]
connectors = [
    "chromadb>=0.4.0",
    "qdrant-client>=1.7.0",
    "pymilvus>=2.3.0",
    "faiss-cpu>=1.7.0",
    "psycopg2-binary>=2.9.0",
    "pymongo>=4.6.0",
    "redis>=5.0.0",
    "elasticsearch>=8.0.0",
    "lancedb>=0.4.0",
]
graph = [
    "networkx>=3.2.0",
    "neo4j>=5.0.0",
]
server = [
    "fastapi>=0.104.0",
    "uvicorn>=0.24.0",
    "websockets>=12.0",
    "python-multipart>=0.0.6",
]
all = [
    "docqwise[full]",
    "docqwise[api]",
    "docqwise[connectors]",
    "docqwise[graph]",
    "docqwise[server]",
]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.1.0",
    "black>=23.0.0",
    "ruff>=0.1.0",
    "mypy>=1.7.0",
    "pre-commit>=3.5.0",
]

[project.scripts]
docqwise = "docqwise.cli.main:app"

[project.urls]
Homepage = "https://github.com/VK-Ant/docqwise"
Documentation = "https://github.com/VK-Ant/docqwise#readme"
Repository = "https://github.com/VK-Ant/docqwise"
Issues = "https://github.com/VK-Ant/docqwise/issues"

[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["docqwise*"]

[tool.black]
line-length = 100
target-version = ["py39"]

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]

[tool.mypy]
python_version = "3.9"
warn_return_any = true
warn_unused_configs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
